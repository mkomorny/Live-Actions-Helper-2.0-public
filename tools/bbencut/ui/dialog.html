<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BBenCut</title>
  <style>
    :root {
      --bg-0: #14161D; --bg-1: #08090C;
      --surface: #15171E; --inset: #0C0D12;
      --border: #242732; --border-hi: #313542;
      --text: #ECEEF2; --dim: #7E8596;
      --on-accent: #10121A;
      --accent-a: #B79BFF; --accent-b: #7C5CFF;
    }
    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; }
    *:focus, *:focus-visible { outline: none; }
    html, body { height: 100%; }
    body {
      --grad-accent: linear-gradient(180deg, var(--accent-b), var(--accent-a));
      background: radial-gradient(120% 130% at 50% 0%, var(--bg-0) 0%, var(--bg-1) 72%);
      color: var(--text);
      font-family: "AbletonSansSmall", system-ui, -apple-system, sans-serif;
      font-size: 12px; -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; overflow: hidden; user-select: none;
    }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 18px; border-bottom: 1px solid var(--border);
    }
    .title { display: flex; flex-direction: column; gap: 1px; }
    .wordmark {
      font-size: 16px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; line-height: 1.05;
      background: var(--grad-accent);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .tagline { font-size: 10px; color: var(--dim); letter-spacing: .2px; }
    .spacer { flex: 1; }
    .clip-chip {
      padding: 4px 10px; border-radius: 999px;
      background: var(--inset); border: 1px solid var(--border); color: var(--dim);
      font-size: 11px; max-width: 280px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    main { flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 18px; overflow-y: auto; min-height: 0; }
    .group { display: flex; flex-direction: column; gap: 6px; }
    .group > .label {
      font-size: 10.5px; font-weight: 600; letter-spacing: .6px;
      text-transform: uppercase; color: var(--dim);
    }
    select, input[type="number"] {
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font: inherit; font-size: 12px; padding: 6px 9px;
      background-color: var(--inset);
    }
    select:focus, input[type="number"]:focus { border-color: var(--accent-b); }
    .length-row { display: flex; gap: 16px; }
    .length-field { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .length-field label { font-size: 11px; color: var(--dim); }
    .params-box {
      display: flex; flex-direction: column; gap: 10px;
      border: 1px solid var(--border); border-radius: 8px; padding: 12px; background: var(--surface);
    }
    .field-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .field-row label { font-size: 11px; color: var(--dim); }
    .field-row input { width: 110px; }
    .no-params { font-size: 11px; color: var(--dim); font-style: italic; }
    footer {
      display: flex; align-items: center; justify-content: flex-end; gap: 10px;
      padding: 12px 18px; border-top: 1px solid var(--border);
    }
    footer button {
      padding: 8px 18px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--inset); color: var(--text); cursor: pointer; font: inherit;
    }
    footer button:hover { border-color: var(--border-hi); }
    footer button#apply {
      border-color: transparent; color: var(--on-accent); font-weight: 700;
      background: var(--grad-accent);
    }
    .note { font-size: 10.5px; color: var(--dim); line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <span class="wordmark">BBenCut</span>
      <span class="tagline">algorithmic breakbeat cutting</span>
    </div>
    <span class="spacer"></span>
    <span class="clip-chip" id="clipChip">…</span>
  </header>

  <main>
    <p class="note">This build computes the cut sequence only -- it does not place clips into Live yet.</p>

    <div class="group">
      <div class="label">Cut procedure</div>
      <select id="algorithm"></select>
    </div>

    <div class="length-row">
      <div class="length-field">
        <label for="totalLength">Total length (beats)</label>
        <input type="number" id="totalLength" step="1" min="0.25" />
      </div>
      <div class="length-field">
        <label for="loopLength">Loop length (beats)</label>
        <input type="number" id="loopLength" step="0.25" min="0.25" />
      </div>
    </div>

    <div class="group">
      <div class="label">Parameters</div>
      <div class="params-box" id="paramFields"></div>
    </div>
  </main>

  <footer>
    <button id="cancel">Cancel</button>
    <button id="apply">Apply</button>
  </footer>

  <script>
    // The host injects the per-invocation BBenCutContext here at dialog time.
    window.__CTX__ = __CTX_JSON__;
  </script>
  <script>"use strict";
(() => {
  // src/slicer.ts
  function isExtendedCut(cut) {
    return Array.isArray(cut);
  }
  var MIN_CLIP_BEATS = 0.25;
  function clampOffset(offset, cutDuration, loopLength) {
    if (cutDuration >= loopLength) return 0;
    const maxOffset = loopLength - cutDuration;
    if (offset > maxOffset) return offset % (maxOffset + 1e-4);
    return offset;
  }
  function generateCutSequence(proc, totalBeats, loopLengthBeats) {
    const blocks = [];
    let pendingOffset = -1;
    proc.attachListener({
      chooseoffset(phrasepos) {
        pendingOffset = phrasepos;
      },
      setoffset(prop, phraseLength) {
        const pl = phraseLength ?? loopLengthBeats;
        pendingOffset = prop * pl;
      },
      updateblock(_blockNum, _phraseProp, cuts, isroll) {
        blocks.push({
          offset: pendingOffset,
          cuts: cuts.map((c) => isExtendedCut(c) ? [...c] : c),
          blocklength: proc.blocklength,
          isStutter: isroll === 1
        });
        pendingOffset = -1;
      }
    });
    let generated = 0;
    while (generated < totalBeats - 1e-5) {
      proc.chooseblock();
      generated += proc.blocklength;
    }
    return blocks;
  }
  function mapToSliceDefinitions(blocks, clipStartTime, clipLoopStart, loopLengthBeats, filePath) {
    const items = [];
    const rollGroups = [];
    let arrangementPos = clipStartTime;
    let pendingSmall = null;
    function flushSmall() {
      if (!pendingSmall || pendingSmall.cuts.length === 0) return;
      if (pendingSmall.totalDur < MIN_CLIP_BEATS) {
        pendingSmall = null;
        return;
      }
      const groupIdx = rollGroups.length;
      rollGroups.push({
        arrangementStartTime: pendingSmall.startPos,
        totalDuration: pendingSmall.totalDur,
        cuts: pendingSmall.cuts
      });
      items.push({
        type: "roll",
        arrangementStartTime: pendingSmall.startPos,
        totalDuration: pendingSmall.totalDur,
        rollGroupIndex: groupIdx
      });
      pendingSmall = null;
    }
    function addSmallCut(sourceOffset, duration) {
      if (!pendingSmall) {
        pendingSmall = { startPos: arrangementPos, totalDur: 0, cuts: [] };
      }
      pendingSmall.cuts.push({
        sourceOffsetBeat: sourceOffset,
        durationBeat: duration
      });
      pendingSmall.totalDur += duration;
    }
    function addClip(duration, markerStart, markerEnd) {
      flushSmall();
      items.push({
        type: "clip",
        arrangementStartTime: arrangementPos,
        duration,
        filePath,
        loopSettings: {
          looping: true,
          startMarker: markerStart,
          endMarker: markerEnd,
          loopStart: markerStart,
          loopEnd: markerEnd
        }
      });
    }
    for (const block of blocks) {
      const firstCut = block.cuts[0];
      if (isExtendedCut(firstCut)) {
        for (const cut of block.cuts) {
          const ioi = cut[0];
          let duration = cut[1];
          const cutOffset = cut[2];
          const amp = cut[3];
          if (duration < 1e-3) {
            arrangementPos += ioi;
            continue;
          }
          if (amp === 0) {
            const silenceOffset = block.offset >= 0 ? block.offset % loopLengthBeats : 0;
            const clamped = clampOffset(silenceOffset, ioi, loopLengthBeats);
            const fillDur = Math.min(ioi, loopLengthBeats - clamped);
            if (ioi >= MIN_CLIP_BEATS && fillDur >= MIN_CLIP_BEATS) {
              addClip(ioi, clipLoopStart + clamped, clipLoopStart + clamped + fillDur);
            } else if (ioi >= MIN_CLIP_BEATS) {
              addClip(ioi, clipLoopStart, clipLoopStart + ioi);
            } else {
              addSmallCut(clamped, fillDur);
            }
            arrangementPos += ioi;
            continue;
          }
          let loopOffset;
          if (cutOffset !== null) {
            loopOffset = cutOffset * loopLengthBeats % loopLengthBeats;
          } else if (block.offset >= 0) {
            loopOffset = block.offset % loopLengthBeats;
          } else {
            loopOffset = 0;
          }
          loopOffset = clampOffset(loopOffset, duration, loopLengthBeats);
          duration = Math.min(duration, loopLengthBeats - loopOffset);
          if (ioi < MIN_CLIP_BEATS) {
            addSmallCut(loopOffset, duration);
          } else {
            addClip(ioi, clipLoopStart + loopOffset, clipLoopStart + loopOffset + duration);
          }
          arrangementPos += ioi;
        }
      } else {
        let loopOffset;
        if (block.offset >= 0) {
          loopOffset = block.offset % loopLengthBeats;
        } else {
          loopOffset = 0;
        }
        for (const cut of block.cuts) {
          const originalDur = cut;
          const clamped = clampOffset(loopOffset, originalDur, loopLengthBeats);
          let cutDuration = Math.min(originalDur, loopLengthBeats - clamped);
          if (originalDur < MIN_CLIP_BEATS) {
            addSmallCut(clamped, cutDuration);
            arrangementPos += originalDur;
            continue;
          }
          if (cutDuration < MIN_CLIP_BEATS) {
            addSmallCut(clamped, cutDuration);
            arrangementPos += originalDur;
            continue;
          }
          addClip(cutDuration, clipLoopStart + clamped, clipLoopStart + clamped + cutDuration);
          arrangementPos += originalDur;
        }
      }
    }
    flushSmall();
    const allItems = items;
    for (let i = 0; i < allItems.length - 1; i++) {
      const curr = allItems[i];
      const next = allItems[i + 1];
      const currEnd = curr.arrangementStartTime + (curr.type === "clip" ? curr.duration : curr.totalDuration);
      const gap = next.arrangementStartTime - currEnd;
      if (gap > 1e-3 && curr.type === "clip") {
        curr.duration += gap;
      }
    }
    const slices = [];
    for (const item of allItems) {
      if (item.type === "clip") {
        const { type: _, ...slice } = item;
        slices.push(slice);
      } else {
        slices.push({
          arrangementStartTime: item.arrangementStartTime,
          duration: item.totalDuration,
          filePath: `__ROLL_GROUP_${item.rollGroupIndex}__`,
          loopSettings: {
            looping: false,
            startMarker: 0,
            endMarker: item.totalDuration,
            loopStart: 0,
            loopEnd: item.totalDuration
          }
        });
      }
    }
    return { slices, rollGroups };
  }

  // src/bbcut/helpers.ts
  var rand = (n) => Math.floor(Math.random() * n);
  var rrand = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
  var coin = (prob) => Math.random() < prob;
  var intDiv = (a, b) => Math.floor(a / b);
  function resolve(x) {
    return typeof x === "function" ? x() : x;
  }
  function wchoose(arr, weights) {
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < arr.length; i++) {
      r -= weights[i];
      if (r <= 0) return arr[i];
    }
    return arr[arr.length - 1];
  }
  var choose = (arr) => arr[Math.floor(Math.random() * arr.length)];
  function scramble(arr) {
    const out = arr.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = out[i];
      out[i] = out[j];
      out[j] = tmp;
    }
    return out;
  }
  function rotate(arr, n) {
    const len = arr.length;
    if (len === 0) return [];
    const shift = (n % len + len) % len;
    return [...arr.slice(shift), ...arr.slice(0, shift)];
  }
  function normalizeSum(arr) {
    const total = arr.reduce((a, b) => a + b, 0);
    return arr.map((x) => x / total);
  }
  function scRound(x, quant) {
    if (quant === 0) return x;
    return Math.round(x / quant) * quant;
  }
  function curdle(arr, prob) {
    const result = [];
    let current = [];
    for (const item of arr) {
      current.push(item);
      if (coin(prob)) {
        result.push(current);
        current = [];
      }
    }
    if (current.length > 0) result.push(current);
    return result;
  }
  var sum = (arr) => arr.reduce((a, b) => a + b, 0);

  // src/bbcut/BBCutProc.ts
  var BBCutProc = class {
    // ── State visible to subclasses and callers ─────────────────────────────
    phrase = 0;
    block = 0;
    beatspersubdiv;
    phraselength;
    phrasepos = 0;
    currphraselength = 0;
    totalbeatsdone = 0;
    /** The cut durations (in beats) produced by the last chooseblock() call. */
    cuts = [];
    /** Total beat length of the current block. */
    blocklength = 0;
    _listener = null;
    constructor(beatsPerSubdiv = 0.5, phraseLength = 4) {
      this.beatspersubdiv = beatsPerSubdiv;
      this.phraselength = phraseLength;
    }
    /** Attach a listener that receives phrase/block/offset callbacks. */
    attachListener(listener) {
      this._listener = listener;
    }
    /** Produce the next block of cuts. Updates this.cuts and this.blocklength. */
    chooseblock() {
      this.newPhraseAccounting();
      this.blocklength = this.currphraselength;
      this.cuts = [this.blocklength];
      this._listener?.chooseoffset?.(
        this.phrasepos,
        this.beatspersubdiv,
        this.currphraselength
      );
      this.updateblock();
      this.endBlockAccounting();
    }
    /** Returns 1 when the current phrase is exhausted, 0 otherwise. */
    phraseover() {
      return this.currphraselength - this.phrasepos < 1e-5 ? 1 : 0;
    }
    // ── Protected accounting helpers ─────────────────────────────────────────
    updateblock(isroll = 0) {
      this._listener?.updateblock?.(
        this.block,
        this.phrasepos / this.currphraselength,
        this.cuts,
        isroll
      );
    }
    /** Begin a new phrase. Pass cpl to override the phraselength for this phrase. */
    newPhraseAccounting(cpl) {
      this.currphraselength = cpl ?? resolve(this.phraselength);
      this._listener?.updatephrase?.(this.phrase, this.currphraselength);
      this.phrasepos = 0;
      this.phrase += 1;
      this.block = 0;
    }
    endBlockAccounting() {
      this.phrasepos += this.blocklength;
      this.totalbeatsdone += this.blocklength;
      this.block += 1;
    }
  };

  // src/bbcut/BBCutProc11.ts
  var BBCutProc11 = class extends BBCutProc {
    _sdiv;
    _barlength;
    _phrasebars;
    _numrepeats;
    _repeatschance;
    _repeatsspeed;
    _repeatsarea;
    // State persisting across blocks within a phrase
    _subdiv = 0;
    _unitsdone = 0;
    _totalunits = 0;
    _repeatson = 0;
    constructor({
      sdiv = 8,
      barlength = 4,
      phrasebars = 3,
      numrepeats = () => rand(2) + 1,
      repeatschance = 0.2,
      repeatsspeed = 2,
      repeatsarea = 0.5
    } = {}) {
      super();
      this._sdiv = sdiv;
      this._barlength = barlength;
      this._phrasebars = phrasebars;
      this._numrepeats = numrepeats;
      this._repeatschance = repeatschance;
      this._repeatsspeed = repeatsspeed;
      this._repeatsarea = repeatsarea;
    }
    chooseblock() {
      let unitblock;
      let repeats;
      if (this._unitsdone >= this._totalunits - 1e-6) {
        const subdiv = Math.round(resolve(this._sdiv));
        const sdivbeats = resolve(this._barlength);
        const numbarsnow = Math.round(resolve(this._phrasebars));
        this._subdiv = subdiv;
        this._totalunits = numbarsnow * subdiv;
        this.currphraselength = sdivbeats * numbarsnow;
        this.newPhraseAccounting(this.currphraselength);
        this.beatspersubdiv = sdivbeats / subdiv;
        this._unitsdone = 0;
      }
      const unitsleft = this._totalunits - this._unitsdone;
      if (coin(resolve(this._repeatschance)) && unitsleft < resolve(this._repeatsarea) * this._subdiv) {
        const stutsp = Math.round(resolve(this._repeatsspeed));
        repeats = unitsleft * stutsp;
        unitblock = 1 / stutsp;
        this.blocklength = this.currphraselength - this.phrasepos;
        this._unitsdone = this._totalunits;
        this._repeatson = 1;
      } else {
        this._repeatson = 0;
        let oddmax = intDiv(this._subdiv, 2);
        oddmax = oddmax % 2 === 0 ? intDiv(oddmax - 2, 2) : intDiv(oddmax - 1, 2);
        unitblock = rrand(0, oddmax);
        unitblock = 2 * unitblock + 1;
        while (unitblock > unitsleft) unitblock -= 2;
        repeats = Math.round(resolve(this._numrepeats));
        let unitproj = repeats * unitblock + this._unitsdone;
        while (unitproj > this._totalunits) {
          repeats -= 1;
          if (repeats <= 1) {
            repeats = 1;
            unitblock = unitsleft;
          }
          unitproj = repeats * unitblock + this._unitsdone;
        }
        this.blocklength = repeats * unitblock * this.beatspersubdiv;
        if (unitproj === this._totalunits) {
          this.blocklength = this.currphraselength - this.phrasepos;
        }
        this._unitsdone += repeats * unitblock;
      }
      this._listener?.chooseoffset?.(
        this.phrasepos,
        this.beatspersubdiv,
        this.currphraselength
      );
      const cutLength = unitblock * this.beatspersubdiv;
      this.cuts = Array.from({ length: repeats }, () => cutLength);
      this.updateblock(this._repeatson);
      this.endBlockAccounting();
    }
  };

  // src/bbcut/ChooseCutProc.ts
  var ChooseCutProc = class extends BBCutProc {
    _cutsizefunc;
    _repeatfunc;
    _rollfunc;
    _rollchance;
    _rollallowed;
    _rollon = 0;
    constructor({
      cutsizefunc,
      repeatfunc,
      rollfunc,
      phraselength = 16,
      rollchance = 0.1,
      rollallowed = 2,
      bpsd = 0.5
    } = {}) {
      super(bpsd, phraselength);
      this._cutsizefunc = cutsizefunc ?? ((_pos, _len) => choose([1, 1.5]));
      this._repeatfunc = repeatfunc ?? ((_size, _pos, _len) => choose([1, 2]));
      this._rollfunc = rollfunc ?? ((blocksize) => {
        const reps = Math.round(blocksize * 4);
        const cutsize = blocksize / reps;
        return Array.from({ length: reps }, () => cutsize);
      });
      this._rollchance = rollchance;
      this._rollallowed = rollallowed;
    }
    chooseblock() {
      if (this.phrasepos >= this.currphraselength) {
        this.newPhraseAccounting();
      }
      const beatsleft = this.currphraselength - this.phrasepos;
      if (coin(resolve(this._rollchance)) && beatsleft < resolve(this._rollallowed)) {
        this._rollon = 1;
        this.blocklength = beatsleft;
        this.cuts = this._rollfunc(beatsleft);
      } else {
        this._rollon = 0;
        let cutsize = this._cutsizefunc(this.phrasepos, this.currphraselength);
        if (cutsize > beatsleft) cutsize = beatsleft;
        let repeats = this._repeatfunc(
          cutsize,
          this.phrasepos,
          this.currphraselength
        );
        let proj = repeats * cutsize + this.phrasepos;
        while (proj > this.currphraselength) {
          repeats -= 1;
          if (repeats <= 1) {
            repeats = 1;
            cutsize = beatsleft;
          }
          proj = repeats * cutsize + this.phrasepos;
        }
        this.cuts = Array.from({ length: repeats }, () => cutsize);
        this.blocklength = repeats * cutsize;
      }
      this._listener?.chooseoffset?.(
        this.phrasepos,
        this.beatspersubdiv,
        this.currphraselength
      );
      this.updateblock(this._rollon);
      this.endBlockAccounting();
    }
  };

  // src/bbcut/ChooseBlockProc.ts
  var ChooseBlockProc = class extends BBCutProc {
    _blocksizefunc;
    _numcutfunc;
    constructor({
      blocksizefunc,
      numcutfunc,
      phraselength = 12,
      bpsd = 0.5
    } = {}) {
      super(bpsd, phraselength);
      this._blocksizefunc = blocksizefunc ?? ((left, _len) => wchoose([0.5, 1, 2], [0.5, 0.4, 0.1]));
      this._numcutfunc = numcutfunc ?? ((size) => size < 1 ? choose([4, 8, 16]) : choose([8, 16, 32]));
    }
    chooseblock() {
      if (this.phrasepos >= this.currphraselength) {
        this.newPhraseAccounting();
      }
      const beatsleft = this.currphraselength - this.phrasepos;
      this.blocklength = this._blocksizefunc(beatsleft, this.currphraselength);
      if (this.blocklength > beatsleft) this.blocklength = beatsleft;
      const repeats = this._numcutfunc(this.blocklength);
      const cutsize = this.blocklength / repeats;
      this.cuts = Array.from({ length: repeats }, () => cutsize);
      this.cuts[repeats - 1] = cutsize + (this.blocklength - cutsize * repeats);
      this._listener?.chooseoffset?.(
        this.phrasepos,
        this.beatspersubdiv,
        this.currphraselength
      );
      this.updateblock();
      this.endBlockAccounting();
    }
  };

  // src/bbcut/WarpCutProc1.ts
  var WarpCutProc1 = class extends BBCutProc {
    _blocksizefunc;
    _rollfunc;
    _probs;
    _accel;
    _rollon = 0;
    constructor({
      blocksizefunc,
      rollfunc,
      probs = [0.5, 0.7, 0.6],
      phraselength = 12,
      accel = 0.9,
      bpsd = 0.5
    } = {}) {
      super(bpsd, phraselength);
      this._blocksizefunc = blocksizefunc ?? ((left, _len) => wchoose([0.5, 1, 2], [0.5, 0.4, 0.1]));
      this._rollfunc = rollfunc ?? ((size) => size < 1 ? choose([4, 8, 16]) : choose([8, 16, 32]));
      this._probs = probs;
      this._accel = accel;
    }
    chooseblock() {
      if (this.phrasepos >= this.currphraselength - 1e-4) {
        this.newPhraseAccounting();
      }
      const beatsleft = this.currphraselength - this.phrasepos;
      this.blocklength = this._blocksizefunc(beatsleft, this.currphraselength);
      if (this.blocklength > beatsleft) this.blocklength = beatsleft;
      if (coin(resolve(this._probs[0]))) {
        this._rollon = 0;
        this.cuts = [this.blocklength];
      } else {
        this._rollon = 1;
        const repeats = this._rollfunc(this.blocklength);
        if (coin(resolve(this._probs[1]))) {
          const cutsize = this.blocklength / repeats;
          this.cuts = Array.from({ length: repeats }, () => cutsize);
        } else {
          const acctemp = resolve(this._accel);
          const temp = this.blocklength * (1 - acctemp) / (1 - Math.pow(acctemp, repeats));
          let cuts = Array.from(
            { length: repeats },
            (_, i) => temp * Math.pow(acctemp, i)
          );
          if (coin(resolve(this._probs[2]))) {
            cuts = cuts.reverse();

          (blockProp) => form.map((cutProp) => this.currphraselength * blockProp * cutProp)

            break;

        cuts[cutoffIndex] = (cuts[cutoffIndex] ?? 0) - (accumulated - beatsleft);
        if (cuts.length < 1) cuts = [beatsleft];
        this.blocklength = beatsleft;
      }
      this.cuts = cuts;
      this._listener?.chooseoffset?.(
        this.phrasepos,
        this.beatspersubdiv,
        this.currphraselength
      );

      this.endBlockAccounting();

  var BBCPPermute = class extends BBCutProc {
    _subdivfunc;
    _permutefunc;
    _repeatsfunc;

        this.beatspersubdiv = this.currphraselength / this._subdiv;

    const proc = spec.build(currentParams);
    const blocks = generateCutSequence(proc, totalLengthBeats, loopLengthBeats);
    const { slices, rollGroups } = mapToSliceDefinitions(
      blocks,
      0,
      // clipStartTime -- honest 0 default; real Arrangement placement is Step 4/5
      0,
      // clipLoopStart
      loopLengthBeats,
      ctx.filePath ?? ""
    );
    return {
      algorithm: currentAlgorithm,
      params: { ...currentParams },
      totalLengthBeats,
      loopLengthBeats,
      slices,
      rollGroups
    };
  }
  function init() {
    el("clipChip").textContent = ctx.hasClip ? ctx.clipName ?? "clip" : "no clip context yet";
    el("totalLength").value = String(ctx.totalLengthBeats);
    el("loopLength").value = String(ctx.loopLengthBeats);
    populateAlgorithmSelect();
    renderParamFields();
    el("cancel").addEventListener("click", () => send(null));
    el("apply").addEventListener("click", () => {
      const req = applyRequest();
      send(JSON.stringify(req));
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") send(null);
    });
  }
  init();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout C · Command list</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.write('<link rel="stylesheet" id="la-theme" href="themes/' + (new URLSearchParams(location.search).get('theme') || 'risograph-art-studio') + '.css">');</script>
<link rel="stylesheet" href="shared/contract.css">
<link rel="stylesheet" href="shared/components.css">
<style>
  /* C · COMMAND LIST -- one column, search-first. The catalog is grouped by what an
     action will TOUCH (selected tracks / whole Set / its own dialog), which is the
     question a user actually has before pressing Run. A tool expands inline like an
     accordion, so nothing ever navigates. Track targeting is a persistent chip strip
     at the foot -- always visible, never a sidebar. Settings is a modal. */
  .C-top { display: flex; align-items: center; gap: 18px; padding: 10px 20px; background: var(--la-bg-2); border-bottom: var(--la-border-w) solid var(--la-border); flex: none; }
  .C-top .la-search { flex: 1; max-width: 560px; margin: 0 auto; }
  .C-top kbd { font: 10px var(--la-font-mono); padding: 1px 6px; border: 1px solid var(--la-border); border-radius: var(--la-r-sm); color: var(--la-text-muted); }
  .C-body { flex: 1; min-height: 0; display: flex; }
  .C-col { width: min(980px, 100%); margin: 0 auto; padding: 18px 24px 24px; }
  .C-sec { margin-bottom: 22px; }
  .C-sechead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .C-sechead h2 { font: 700 calc(15px * var(--la-heading-scale)) var(--la-font-display); }
  .C-sechead .la-muted { font-size: 12px; }
  .C-list { display: flex; flex-direction: column; gap: 6px; }
  .C-exp { margin: -2px 0 6px; padding: 16px 20px 20px 34px; background: var(--la-surface); border: var(--la-border-w) solid var(--la-accent); border-top: 0; border-radius: 0 0 var(--la-r-md) var(--la-r-md); }
  .C-exp .la-field { max-width: 560px; }
  .C-open { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-color: var(--la-accent); }
  .C-strip { display: flex; align-items: center; gap: 12px; padding: 9px 20px; background: var(--la-bg-2); border-top: var(--la-border-w) solid var(--la-border); flex: none; }
  .C-chips { display: flex; gap: 6px; overflow-x: auto; flex: 1; padding: 2px 0; }
  .C-tchip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: var(--la-r-full); border: var(--la-border-w) solid var(--la-border); background: var(--la-surface); color: var(--la-text-muted); font-weight: 600; white-space: nowrap; transition: all var(--la-dur) var(--la-ease); }
  .C-tchip:hover { color: var(--la-text); }
  .C-tchip.on { background: var(--la-accent); border-color: var(--la-accent); color: var(--la-accent-text); }
  .C-tchip small { font: 700 8.5px var(--la-font-mono); opacity: .7; }
  .C-genius { max-width: 820px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; padding: 18px 24px 10px; min-height: 0; flex: 1; }
</style>
<script src="shared/data.js"></script>
<script src="shared/shared.js"></script>
</head>
<body>
<div id="app"></div>
<script>
  const S = { layoutId: "c", page: "actions", tool: null, q: "", console: false, settings: false, pop: null };
  const SECTIONS = [
    ["tracks", "On your selected tracks", "Only touches the tracks ticked below"],
    ["set", "On the whole Set", "Ignores track selection"],
    ["dialog", "Opens its own dialog", "Nothing is written until you confirm inside"],
  ];

  const topbar = () => `<header class="C-top">
      <div class="la-brand"><i>${LA.icon("bolt", 13)}</i>Live Actions</div>
      <label class="la-search">${LA.icon("search", 15)}<input data-input="q" value="${LA.esc(S.q)}" placeholder="Search actions, or ask Genius…"><kbd>Ctrl K</kbd></label>
      <nav><button class="la-tab${S.page === "actions" ? " on" : ""}" data-act="page" data-k="actions">Actions</button><button class="la-tab${S.page === "genius" ? " on" : ""}" data-act="page" data-k="genius">Genius</button></nav>
      <button class="la-btn ghost" data-act="diag">${LA.pip()}</button>
      <button class="la-iconbtn" data-act="settings" aria-label="Preferences">${LA.icon("gear", 18)}</button>
      ${S.pop === "diag" ? `<div class="la-pop" style="right:56px;top:52px;width:300px">${LA.diagPanel()}</div>` : ""}</header>`;

  const section = ([key, title, sub], tools) => {
    const list = tools.filter((t) => LA.scopeOf(t).key === key);
    if (!list.length) return "";
    return `<section class="C-sec"><div class="C-sechead"><h2>${title}</h2><span class="la-muted">${list.length} · ${sub}</span></div><div class="C-list">
      ${list.map((t) => { const open = S.tool === t.id; return LA.toolRow(t, { open }).replace('class="la-row', `class="la-row${open ? " C-open" : ""}`) + (open ? `<div class="C-exp">${LA.toolBody(t, { head: false, backLabel: "Collapse" })}</div>` : ""); }).join("")}</div></section>`;
  };

  const actions = () => {
    const tools = LA.filterTools(S);
    return `<div class="C-body la-scroll"><div class="C-col">${tools.length ? SECTIONS.map((s) => section(s, tools)).join("") : `<p class="la-muted" style="padding:40px;text-align:center">No action matches “${LA.esc(S.q)}”.</p>`}</div></div>`;
  };
  const genius = () => `<div class="C-body"><div class="C-genius"><div class="la-scroll" style="flex:1">${LA.chat()}</div>${LA.composer()}</div></div>`;

  const strip = () => `<div class="C-strip"><span class="la-section-title">Targets</span>
      <div class="C-chips">${LA.tracks.map((t) => `<button class="C-tchip${LA.state.targets.has(t.id) ? " on" : ""}" data-act="toggle-track" data-id="${t.id}">${t.id} ${LA.esc(t.name)} <small>${t.kind}</small></button>`).join("")}</div>
      ${LA.quickPicks()}</div>`;

  const render = () => `${topbar()}${S.page === "genius" ? genius() : actions()}${strip()}${LA.consoleDrawer(S)}${LA.statusbar(S)}${LA.settingsModal(S)}`;

  LA.mount(S, render, {
    page: (el) => { S.page = el.dataset.k; },
    diag: (el, prev) => { S.pop = prev === "diag" ? null : "diag"; },
    "open-tool": (el) => { S.tool = S.tool === el.dataset.id ? null : el.dataset.id; },
  });
</script>
</body>
</html>
